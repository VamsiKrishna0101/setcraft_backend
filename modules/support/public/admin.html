<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setcraft · Support inbox</title><link rel="stylesheet" href="/support/style.css"><script src="/support/admin.js" defer></script></head><body><main>
<header><div><div class="eyebrow">SETCRAFT</div><h1>Support inbox</h1><p>Account support, with the context to help.</p></div><button id="logout" class="secondary" hidden>Sign out</button></header>
<p id="notice" class="error" role="status" aria-live="polite"></p>
<form id="login" class="card compact"><h2>Admin sign in</h2><p>Use an existing Setcraft admin account.</p><label for="email">Email</label><input id="email" type="email" required autocomplete="username"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password" minlength="8"><p><button type="submit">Sign in</button></p></form>
<section id="inbox" class="layout" hidden><aside class="card"><div class="tools"><select id="filter" aria-label="Filter tickets"><option value="">All statuses</option><option value="OPEN">Open</option><option value="IN_PROGRESS">In progress</option><option value="WAITING_FOR_USER">Waiting for user</option><option value="RESOLVED">Resolved</option></select><button id="refresh" class="secondary">Refresh</button></div><div id="tickets"></div><p id="empty" hidden>No tickets here yet.</p><button id="more" class="secondary" hidden>Load more</button></aside>
<article id="detail" class="card"><p>Select a ticket to read the conversation.</p></article></section>
</main></body></html>
